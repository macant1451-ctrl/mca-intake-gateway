name: Synthetic gateway tests
on:
  pull_request:
    branches: [main]
  push:
    branches: [fix/pilot-safe-gateway]
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test test/gateway.test.mjs
