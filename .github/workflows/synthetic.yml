name: Synthetic gateway tests
on:
  pull_request:
    branches: [main]
  push:
    branches: [fix/pilot-safe-gateway]
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test test/gateway.test.mjs

  # Real PostgreSQL integration tests against a disposable, job-scoped database.
  # The container exists only for the life of this job; nothing here touches
  # Railway, GHL, Trulli, or any shared database.
  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          # Throwaway credentials for an ephemeral CI-only container on localhost.
          POSTGRES_USER: synthetic
          POSTGRES_PASSWORD: synthetic_ci_only
          POSTGRES_DB: gateway_synthetic_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U synthetic -d gateway_synthetic_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: PostgreSQL integration suite
        env:
          SYNTHETIC_TEST_ONLY: 'true'
          TEST_DATABASE_URL: postgresql://synthetic:synthetic_ci_only@localhost:5432/gateway_synthetic_ci
        run: npm run test:integration
